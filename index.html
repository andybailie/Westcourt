<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Audio-Visual Gallery</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            /* Prevents text selection and native swipe-to-refresh while dragging */
            user-select: none; 
            touch-action: none; 
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            line-height: 1.5;
            z-index: 10;
        }
        
        /* Mobile On-Screen Controls */
        #mobile-controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: none; /* Hidden by default (for desktop) */
            flex-direction: column;
            align-items: center;
            z-index: 20;
        }
        .joy-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .joy-btn {
            width: 60px;
            height: 60px;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 12px;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }
        .joy-btn:active {
            background: rgba(255,255,255,0.4);
        }

        /* Detect touch devices and show the mobile controls */
        @media (pointer: coarse) {
            #mobile-controls {
                display: flex;
            }
            #desktop-instructions {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <strong>Controls:</strong><br>
        <span id="desktop-instructions">
            ⬆️ ⬇️ : Move Forward / Backward<br>
            ⬅️ ➡️ : Rotate Left / Right<br>
            🖱️ <strong>Drag:</strong> Click and drag to look around<br>
        </span>
        <span style="display:none;" id="mobile-instructions">
            👆 <strong>Swipe:</strong> Look around<br>
            🔘 <strong>Buttons:</strong> Move & Rotate<br>
        </span>
        🟩 <strong>Click/Tap:</strong> Green buttons play audio
    </div>

    <!-- On-Screen D-Pad for Mobile -->
    <div id="mobile-controls">
        <div class="joy-btn" id="btn-fwd">⬆️</div>
        <div class="joy-row">
            <div class="joy-btn" id="btn-left">⬅️</div>
            <div class="joy-btn" id="btn-back">⬇️</div>
            <div class="joy-btn" id="btn-right">➡️</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // Swap instructions if on mobile
        if (window.matchMedia("(pointer: coarse)").matches) {
            document.getElementById('mobile-instructions').style.display = 'inline';
        }

        // ==========================================
        // 1. GALLERY DATA CONFIGURATION
        // ==========================================
        const galleryItems = [
            {
                image: "images/image_1.jpg",
                text: "Exhibit 1\n\nCommercial Narration.\n\nA warm, authoritative read tailored for corporate broadcasting and brand anthems.",
                audio: "audio/track_1.mp3"
            },
            {
                image: "images/image_2.jpg",
                text: "Exhibit 2\n\nCharacter Voice.\n\nDeep and gravelly tone suitable for video game antagonists or dramatic storytelling.",
                audio: "audio/track_2.mp3"
            },
            {
                image: "images/image_3.jpg",
                text: "Exhibit 3\n\nE-Learning Module.\n\nClear, paced, and articulate delivery to guide listeners through complex technical concepts.",
                audio: "audio/track_3.mp3"
            },
            {
                image: "images/image_4.jpg",
                text: "Exhibit 4\n\nDocumentary Read.\n\nNatural, resonant Northern Irish delivery for long-form factual content and nature programming.",
                audio: "audio/track_4.mp3"
            },
            {
                image: "images/image_5.jpg",
                text: "Exhibit 5\n\nAudiobook Sample - Fiction.\n\nDynamic pacing showcasing emotional range and subtle character distinctions.",
                audio: "audio/track_5.mp3"
            },
            {
                image: "images/image_6.jpg",
                text: "Exhibit 6\n\nRadio Imaging.\n\nPunchy, high-energy sweepers and station idents to cut through the mix.",
                audio: "audio/track_6.mp3"
            },
            {
                image: "images/image_7.jpg",
                text: "Exhibit 7\n\nAnimation Voiceover.\n\nExaggerated and expressive vocal performance designed for animated shorts.",
                audio: "audio/track_7.mp3"
            },
            {
                image: "images/image_8.jpg",
                text: "Exhibit 8\n\nPodcast Intro.\n\nInviting and professional establishing tone to hook listeners in the first ten seconds.",
                audio: "audio/track_8.mp3"
            },
            {
                image: "images/image_9.jpg",
                text: "Exhibit 9\n\nMedical Narration.\n\nPrecise pronunciation and measured delivery for clinical or pharmaceutical scripts.",
                audio: "audio/track_9.mp3"
            },
            {
                image: "images/image_10.jpg",
                text: "Exhibit 10\n\nPromo Read.\n\nUrgent, intense style perfect for upcoming event trailers and television promos.",
                audio: "audio/track_10.mp3"
            },
            {
                image: "images/image_11.jpg",
                text: "Exhibit 11\n\nExplainer Video.\n\nFriendly, conversational approach that makes dry information accessible and engaging.",
                audio: "audio/track_11.mp3"
            },
            {
                image: "images/image_12.jpg",
                text: "Exhibit 12\n\nTheatrical Trailer.\n\nMaximum resonance and gravitas for cinematic theatrical releases.",
                audio: "audio/track_12.mp3"
            }
        ];

        // ==========================================
        // 2. SCENE SETUP
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333); 
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0); 
        camera.rotation.order = 'YXZ'; 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);
        
        const pointLight = new THREE.PointLight(0xffffee, 1.5, 50);
        pointLight.position.set(0, 10, 0);
        scene.add(pointLight);

        // ==========================================
        // 3. ENVIRONMENT & ROOM
        // ==========================================
        const roomSize = 40;
        const textureLoader = new THREE.TextureLoader();
        
        const roomGeometry = new THREE.BoxGeometry(roomSize, 12, roomSize);
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x888888, side: THREE.BackSide });
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x555555, side: THREE.BackSide });
        const ceilingMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, side: THREE.BackSide });
        
        const roomMaterials = [wallMaterial, wallMaterial, ceilingMaterial, floorMaterial, wallMaterial, wallMaterial];
        const room = new THREE.Mesh(roomGeometry, roomMaterials);
        room.position.y = 6; 
        scene.add(room);

        // ==========================================
        // 4. EASEL GENERATOR 
        // ==========================================
        function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 512, 512);
            
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 28px sans-serif'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            
            const maxWidth = 460; 
            const lineHeight = 36;
            let y = 40; 

            const paragraphs = text.split('\n');
            
            paragraphs.forEach(paragraph => {
                const words = paragraph.split(' ');
                let currentLine = '';

                for (let n = 0; n < words.length; n++) {
                    const testLine = currentLine + words[n] + ' ';
                    const metrics = ctx.measureText(testLine);
                    
                    if (metrics.width > maxWidth && n > 0) {
                        ctx.fillText(currentLine, 256, y);
                        currentLine = words[n] + ' ';
                        y += lineHeight;
                    } else {
                        currentLine = testLine;
                    }
                }
                ctx.fillText(currentLine, 256, y);
                y += lineHeight; 
            });
            
            return new THREE.CanvasTexture(canvas);
        }

        const easels = new THREE.Group();
        scene.add(easels);

        const positions = [
            { x: -10, z: -18, rotY: 0 }, { x: 0, z: -18, rotY: 0 }, { x: 10, z: -18, rotY: 0 },
            { x: 10, z: 18, rotY: Math.PI }, { x: 0, z: 18, rotY: Math.PI }, { x: -10, z: 18, rotY: Math.PI },
            { x: 18, z: -10, rotY: -Math.PI/2 }, { x: 18, z: 0, rotY: -Math.PI/2 }, { x: 18, z: 10, rotY: -Math.PI/2 },
            { x: -18, z: 10, rotY: Math.PI/2 }, { x: -18, z: 0, rotY: Math.PI/2 }, { x: -18, z: -10, rotY: Math.PI/2 }
        ];

        galleryItems.forEach((data, i) => {
            const pos = positions[i];
            const easelGroup = new THREE.Group();
            
            const imgGeo = new THREE.PlaneGeometry(3, 3);
            const imgMat = new THREE.MeshBasicMaterial({ map: textureLoader.load(data.image), side: THREE.DoubleSide });
            const imgMesh = new THREE.Mesh(imgGeo, imgMat);
            imgMesh.position.set(-2, 2.5, 0);
            
            const borderGeo = new THREE.BoxGeometry(3.2, 3.2, 0.1);
            const borderMat = new THREE.MeshStandardMaterial({ color: 0x2a1610 });
            const borderMesh = new THREE.Mesh(borderGeo, borderMat);
            borderMesh.position.set(-2, 2.5, -0.06);

            const textGeo = new THREE.PlaneGeometry(2, 2.5);
            const textMat = new THREE.MeshBasicMaterial({ map: createTextTexture(data.text) });
            const textMesh = new THREE.Mesh(textGeo, textMat);
            textMesh.position.set(1.5, 2.75, 0);
            
            const textBorder = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.7, 0.1), borderMat);
            textBorder.position.set(1.5, 2.75, -0.06);

            const btnGeo = new THREE.BoxGeometry(1.5, 0.5, 0.2);
            const btnMat = new THREE.MeshStandardMaterial({ color: 0x28a745 });
            const btnMesh = new THREE.Mesh(btnGeo, btnMat);
            btnMesh.position.set(1.5, 1, 0);
            
            btnMesh.userData = { isAudioButton: true, audioUrl: data.audio };

            easelGroup.add(imgMesh, borderMesh, textMesh, textBorder, btnMesh);
            easelGroup.position.set(pos.x, 0, pos.z);
            easelGroup.rotation.y = pos.rotY;
            easels.add(easelGroup);
        });

        // ==========================================
        // 5. INTERACTION, MOUSE & TOUCH LOOK
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let currentAudio = null;
        
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let dragDistance = 0; 

        // --- DESKTOP MOUSE LOOK ---
        window.addEventListener('mousedown', (event) => {
            if(event.target.closest('#mobile-controls')) return; 
            isDragging = true;
            dragDistance = 0;
            previousMousePosition = { x: event.clientX, y: event.clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(easels.children, true);
            const hovering = intersects.some(i => i.object.userData.isAudioButton);
            document.body.style.cursor = hovering ? 'pointer' : (isDragging ? 'grabbing' : 'default');

            if (isDragging) {
                const deltaX = event.clientX - previousMousePosition.x;
                const deltaY = event.clientY - previousMousePosition.y;
                dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

                camera.rotation.y -= deltaX * 0.005;
                camera.rotation.x -= deltaY * 0.005;
                camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
                previousMousePosition = { x: event.clientX, y: event.clientY };
            }
        });

        // --- MOBILE TOUCH LOOK ---
        window.addEventListener('touchstart', (event) => {
            if(event.target.closest('#mobile-controls')) return; // Ignore if pressing D-Pad
            if (event.touches.length === 1) {
                isDragging = true;
                dragDistance = 0;
                previousMousePosition = { x: event.touches[0].clientX, y: event.touches[0].clientY };
            }
        });

        window.addEventListener('touchmove', (event) => {
            if (isDragging && event.touches.length === 1) {
                const deltaX = event.touches[0].clientX - previousMousePosition.x;
                const deltaY = event.touches[0].clientY - previousMousePosition.y;
                dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

                camera.rotation.y -= deltaX * 0.005;
                camera.rotation.x -= deltaY * 0.005;
                camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
                previousMousePosition = { x: event.touches[0].clientX, y: event.touches[0].clientY };
            }
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        // --- CLICK / TAP TO PLAY AUDIO ---
        window.addEventListener('click', (event) => {
            if (dragDistance > 10 || event.target.closest('#mobile-controls')) return;

            // Ensure mouse coordinates are exact for tap locations
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(easels.children, true);
            const clickedButton = intersects.find(i => i.object.userData.isAudioButton);

            if (clickedButton) {
                const url = clickedButton.object.userData.audioUrl;
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                
                const originalColor = clickedButton.object.material.color.getHex();
                clickedButton.object.material.color.setHex(0xffffff);
                setTimeout(() => clickedButton.object.material.color.setHex(originalColor), 200);

                currentAudio = new Audio(url);
                currentAudio.play().catch(e => console.log("Audio playback requires a valid file path.", e));
            }
        });

        // ==========================================
        // 6. MOVEMENT CONTROLS (Keyboard & On-Screen)
        // ==========================================
        const keys = { w: false, a: false, s: false, d: false };
        const moveSpeed = 0.15;
        const turnSpeed = 0.04; // Slightly faster turning for mobile comfort

        // Keyboard setup
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') keys.w = true;
            if (e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 'ArrowRight') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') keys.w = false;
            if (e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 'ArrowRight') keys.d = false;
        });

        // Mobile UI setup
        const bindJoyButton = (id, keyName) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const press = (e) => { e.preventDefault(); keys[keyName] = true; };
            const release = (e) => { e.preventDefault(); keys[keyName] = false; };
            
            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        };

        bindJoyButton('btn-fwd', 'w');
        bindJoyButton('btn-back', 's');
        bindJoyButton('btn-left', 'a');
        bindJoyButton('btn-right', 'd');

        // ==========================================
        // 7. RENDER LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            const moveDirection = new THREE.Vector3();
            camera.getWorldDirection(moveDirection);
            moveDirection.y = 0; 
            moveDirection.normalize();

            if (keys.w) camera.position.addScaledVector(moveDirection, moveSpeed);
            if (keys.s) camera.position.addScaledVector(moveDirection, -moveSpeed);
            
            if (keys.a) camera.rotation.y += turnSpeed;
            if (keys.d) camera.rotation.y -= turnSpeed;

            if (camera.position.x > 18) camera.position.x = 18;
            if (camera.position.x < -18) camera.position.x = -18;
            if (camera.position.z > 18) camera.position.z = 18;
            if (camera.position.z < -18) camera.position.z = -18;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
