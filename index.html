<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Audio-Visual Gallery (VR, Textures & Background Music)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            user-select: none; 
            touch-action: none;
            overscroll-behavior: none;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            line-height: 1.5;
            font-size: 14px;
            z-index: 10;
        }
        
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        .control-row {
            display: flex;
            gap: 20px;
        }
        .dir-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
        }
        .dir-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }

        @media (min-width: 800px) {
            #mobile-controls {
                opacity: 0.5; 
            }
        }

        /* Moves the Three.js VR button to the bottom right */
        #VRButton {
            left: auto !important;
            right: 20px !important;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <strong>Controls:</strong><br>
        🖱️/👆 <strong>Look:</strong> Drag screen<br>
        🖱️/👆 <strong>Play:</strong> Tap green buttons<br>
        ⌨️/🔘 <strong>Move:</strong> Arrow keys or on-screen buttons<br>
        🥽 <strong>Quest 3:</strong> Left Stick moves, Right Stick turns<br>
        🔙 <strong>Exit VR:</strong> Press Menu (☰), X, or Y on Left Controller
    </div>

    <!-- On-Screen D-Pad -->
    <div id="mobile-controls">
        <div class="dir-btn" id="btn-up">⬆️</div>
        <div class="control-row">
            <div class="dir-btn" id="btn-left">⬅️</div>
            <div class="dir-btn" id="btn-down">⬇️</div>
            <div class="dir-btn" id="btn-right">➡️</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';

      // ==========================================
        // 1. GALLERY DATA CONFIGURATION
        // ==========================================
        const galleryItems = [
            {image: "images/Tracks.jpg", 
                text: "Conversations with My Addiction\n\nYou might have thought you’ve won by taking everything from me. But not today.\nToday I chose to build back stronger. So I take back my power.\nYou thought you had me cornered and isolated. You thought you had me so messed up inside and weak.\nBut I chose to go within and confront my traumas one by one.\nThe constant negative words whispered in my ear, “you’re not good enough”, “you’re a disgrace”, “no one will want you again”.\nToday I chose to be my own best friend and give myself some self-care and love. From this I can flourish. I am worthy of a lot more.\nI was only as sick as my secrets. Today they got outed.\nNo more manipulation, ducking and diving and lies.\nToday I only speak the truth and if you don’t like that then you are not welcome here.\nToday I found me.\nToday I speak to people that can suggest another approach to life.\nToday I can sort through my thoughts and know what is real and what is not.\nToday I choose not to wallow in self-pity.\nI choose life over death.\nI choose freedom over jails or institutions.", 
                audio: "audio/audio1.m4a" },
            { image: "images/Roots.jpg",
             text: "Lend Me Your Ears\n\nMost of my adult life so far has been the best of times and also the worst of times. Living in a bubble, carefree, un-ambitious, uninspired, day-to-day existing, time sapping, a draining path where alcohol came first. I had a cavalier mind about it – putting alcohol before my family relations, mental health, physical health, safety and shelter.\n\nI grew up with addiction in my family, I seen it young but never thought that it would affect my life. Soon I realised that I was repeating the behaviour and becoming even worse.\n\nI didn’t care if I was living in a room or in a bedsit with no windows, as long as I could jam the door locked. It was like I’d rather be nowhere else at times. I thought ‘this is the best I can be today and that is good enough\". Living in the pools you forget about the sea. Drinking became something I just didn’t look forward to anymore - more like something I needed. I became controlled by it and life became unmanageable. My self-care, well-being, functionality, all withered away.\n\nMy drinking went beyond social drinking – drink before, drink during and drink after. I was highly strung, irritable and agitated. What you are not changing, you are choosing and sometimes repeated mistakes become a choice. I thought I could control my drinking. Truth is, I couldn’t. I tried managing it, negotiating with it, outsmarting it but I always lost.\n\nSobriety didn’t truly start for me until I finally realised I had to walk away. Being sober is the choice to stop the behaviour that leads there.\n\nSober isn’t boring;\nSober is remembering every laugh;\nSober is waking up without guilt;\nSober is building the life you were scared to dream about;\nMy changes haven’t always been permanent but the change I want is.",
             audio: "audio/audio2.m4a" },
            { image: "images/Rain.jpg",
             text: "The Rain\n\nIf in the morning I do not wake it was because of all my pain;\nI hope and wished for brighter days but all I got was the rain.\n\nI tried so hard to push through the pain hoping the rain would clear;\npraying for a little bit of sunshine and those brighter days to reappear.\n\nAs the days turned to weeks and then into months and the sun still didn’t show, I believed in my heart it was then my time to go.\n\nI wanted to stay for longer, to one day make everyone proud; it’s just no matter how hard I try, I can’t outrun this constant dark cloud.\n\nI hope one day you can understand it was because of all my pain; my only wish is that I could have been stronger than the rain.",
             audio: "audio/track_3.mp3" },
            { image: "images/Time.jpg", 
             text: "Wednesdays\n\nFriday Wee treat, sweet.\nI’ve earned it… Entitled\nSaturday, feel like shit.\n\nWednesday - no confession.\nFriday… Groundhog Day,\nSaturday, take the edge off.\n\nWednesday… No confession\nBuying bulk, prudence\nFriday, weekend bender.\n\nMonday, take the edge off, functional;\nWednesday, no confession\nBulk again, makes sense\nWatch the pounds, and the pence\nThursday to Sunday foot to the floor.\n\nCan’t work Monday, body sore\nTuesday, take the edge off\nWednesday, I’m beat.\n\nI realised once I used on Wednesdays I had a problem;\nWeekends start earlier, finish later\nNot my fault, become a hater.\n\nWednesday\nMy confession\nHalf truths, denial, blind to progression\nManipulation, control\nTotal obsession.",
             audio: "audio/track_12.mp3" },
            { image: "images/Frontdoor.jpg",
             text: "It’s An Inside Job\n\nWe look around and see pain and hurt;\nWe internalise and feel like a piece of dirt.\nWe are only drinking alcohol and doing no harm;\nuntil one day the body sounds the alarm.\nIt’s either jail or hospital or maybe even your last breath;\nThis is real life, not a scene from Macbeth.\nFamily and friends all around us worried and sick;\nI know now in my heart it’s a habit I have to kick.\nAsking for help were words I never knew;\nBut breaking my pride was a journey I had to go through.\nInto rehab, not knowing what you expect;\nAll I knew was my head was wrecked.\nThree months of inner work began;\nNot knowing I was about to meet my clan.\nAlways misunderstood and put upon;\nFinally, I was accepted and felt like a swan.\nThey would help me look within;\nSo to help me find my own self.\nI had built a world around me, which was selfish to the core;\nThis was news to me as I never looked at me before.\nMy lifetime habits and behaviours lead to my perceptions;\nNow it’s time to change with no more deceptions.\nNo more wallowing in self-pity;\nIt’s time to return to the city.\nWith all the tools from rehab at my disposal;\nIt’s time to integrate into the hostel.\nOne day at a time to even an hour at a time;\nIt’s not easy policing my thoughts day in and day out.\nBut it’s better than being sick of being sick, of that I have no doubt.",
             audio: "audio/track_5.mp3" },
            { image: "images/Maninthemirror.jpg",
             text: "The Man in the Mirror\n\nI’m gonna make a change for once in my life. It’s gonna feel real good it’s gonna make a difference. I’m starting with the man in the mirror, I’m asking him to change his ways. If you want the world to be a better place, a more fulfilling life take a good look at yourself and make that change”.\n\nI look at my behaviours and how they deeply affected those around me; in relationships, with work colleagues and generally how I conducted my day-to-day living.\n\nI linked alcohol, drugs and gambling to those behaviours. While topping up my addictions give me a form of escape from reality. A reality formed at a young age through self-belief, thoughts of not living up to other peoples or family standards. Looking around me at 10 or 11 years old and comparing myself to others including cousins and friends.\n\nA warped way of thinking at such a young age, the formative years and carrying it through to adulthood. A made up persona to conform to the world around me. A world at my core I hated. I built this persona, especially in high school so that I was not disliked or bullied. I was always in a fight or fighting mood. Always on the front foot, battle ready. I done some bad things on the spur of the moment and lived to regret them.\n\nThat regret and shame was like a tug of war in my head, the good side always fighting the bad side. In those years my mental health struggled. Alcohol so young was like fuel to the fire. The behaviours were out of control.", 
             audio: "audio/track_6.mp3" },
            { image: "images/Themask.jpg",
             text: "Remove The Mask Fill The Void\n\nBehind every mask the shadow of addiction lurks;\nthe smiling mask that we show to the world has sinister underlying issues underneath.\nThe confident mask that hides our fear.\nThe false personas that hide our pain, our true selves and shame.\nRemove the masks one by one to find a real, imperfect self.\nThrough honest acceptance and connections.\nNo more using masks as a defence mechanism to hide our vulnerability.\nRemove the mask and find the original you.",
             audio: "audio/track_7.mp3" },
            { image: "images/Outwithfriends.jpg",
             text: "Sick As Your Secret\n\nWe are only as sick as our secrets.\nWhen buried inside of us, our secrets can cause bitter and twisted perceptions.\nI personally didn’t like what I was witnessing around me growing up, so I fabricated a world of make believe.\n\nLoneliness and isolation wasn’t long to follow.\nTrips to psychologists was the normal - my childhood, adolescence and adult lives consisted of this.\n\nMy mind and thoughts were dark and delusional.\nFrequent outbursts and out of character episodes came along. Emotionally disabled, I tried to carry on but relationships faltered and fell away after some years. No one got me, I didn’t feel good enough.\n\nThen began the outside validation. Anyone or group that showed interest I latched onto, especially if drink or drugs were involved.\nDrink would calm my thoughts. I felt in control of me when drunk. Drugs would soothe my feelings. This began my 40 year love affair with alcohol and drugs. In this time my life became unmanageable.\n\nNow looking back, being 17 months clean, I could cringe. Today my perceptions have changed. Change, what a beautiful word. Without change I would be back on that merry-go round of madness, thinking the world was against me.",
             audio: "audio/track_8.mp3" },
            { image: "images/Curtains.jpg",
             text: "Middletown Dreams\n\nThe family visit closed early\nThe hidden bottle came out\nI turned to close the blinds\nA little slow now, a little start.\n\nBut he’s heading down those tracks\nAny time now for sure\nAnother day as drab as today\nIt’s more than a man can endure.\n\nDreams flow across the heartland\nFeeding on the fires\nDreams transport desires\nDrive you when you’re down\nDreams transport the ones\nWho need to get out of town",
             audio: "audio/track_9.mp3" },
            { image: "images/Mybench.jpg",
             text: "My Bench\n\nYes that’s my bench, its where I lay my head,\nit’s not very comfortable but to me it’s bed.\nIt’s not the prettiest my bench, paint cracked and rusted through, sure I’ll not be here long so for now it will do.\n\nI lay here some nights staring at the stars, counting the months I’ve been here, I used to count just the hours.\nEvery morning the people come and take my bench away, they sit there with their coffee while the children go and play.\n\nIt’s then I hide out of site so no-one knows my fate,\ncounting down the hours till the ward locks the gate.\nThat’s when I get my bench back, my bed for the night, though most nights I just lie awake yearning for daylight.\n\nThere’s nights I do sleep and dream here in the park, I dream to no longer be afraid hiding in the dark.\nYes that’s my bench, it’s where I lay my head,\n\nI’m not asking for much, I just want my own bed.",
             audio: "audio/track_10.mp3" },
            { image: "images/Locked.jpg",
             text: "Addiction — Flip The Mindset\n\nDon’t look back with anger, look at the part you played. Don’t look back at the episodes and search for someone to blame. Don’t entertain those childish perceptions as they are only made up. Come away from those playground antics - these outrageous behaviours from adolescence must be left behind.\n\nThe world we built in our mind must be dismantled. The walls we built for our own protection must come down. Free our minds of addiction or it’s a lifetime of contradiction. “He did this”, “she did that” has to go. Common ground has to be found or in this world you will surely drown. Learn to forgive oneself or we will end up on the shelf. We must fix steps to let go or past pain will only grow.\n\nPity parties must ebb away or one day out you go with nowhere to stay. You have to go within to flow out of your trauma or you’re in for a life of drama. Ask for help to break that pride or you’ll be in for a rough ride. Say cheerio to our ego for not everything has to be known. Trust the process and believe me, it’s great without the stress.",
             audio: "audio/track_11.mp3" },
            { image: "images/Keepfit.jpg",
            text: "Hopeless To A Miracle\n\nMy journey out of hell came at a great cost. It was a cost I dreaded, but for my departure this bill was due.\nThe comfort of drugs and alcohol - I gave full submission. From there I drowned in debt and horrific addiction.\nFrom the weight of the world on my shoulders and crying my last tear, God gave me a listening ear.\nTo a homeless drunk, a reason to live - a solution to my problem, I became a marathon man.\nFrom having nothing to having my own home, from hating to becoming a loving man, I am certain God’s got a new plan.",
            audio: "audio/track_3.mp3" },
            { image: "images/Placeholder13.jpg",
             text: "Naked Shame\n\nThe word homeless lands in rooms like a fist.\n“It’s only for a bit.” — a lie worn like a jersey that doesn’t fit.\n“His own fault,” they murmur with soft, comfortable cruelty.\nAnd I carry that whisper like a stone in my coat.\nI dress in clothes that’ve been donated with good intentions. Each seam says: not yours. Each tag says: someone else’s past.\nHear me properly: I am ashamed and I am furious.\nI am ashamed that I must ask, and furious that I must beg.\nIf my head bursts from the pressure, let the pieces spell out the names of the people who walked past, the policies that failed, the hands that closed.\nAnger that remembers names of councillors who promised, then vanished.\nI am Sean Kane.\nSofa-surfed, doorstep-slept, paper-checked, system-f**ked, still standing. \nI am tired, but not finished — not by a long shot.",
             audio: "audio/track_13.mp3" },
            { image: "images/Hope.jpg",
             text: "People Of The Best Kind\n\nGot a call from a hostel, turns out they had a room;\nGood news for this desperate homeless man you would think but for me, I feared more gloom.\n\nI had lost my mom, I lost my home, I damn near lost my mind;\nNow I would be surrounded by Drunks and Junkies, the people of the worst kind.\n\nI got to the room I was given, soon there was a loud knock on my door;\nTurns out the fella across from me had spare food, and asked if I needed more.\n\nSoon I was given and old phone, some tobacco and even an old tv;\nThey invited me for walks and talks and all their kindness and advice of course was all for free.\n\nTurns out the drunks and junkies, and people of the worst kind;\nWere just trying to make it through another day and making sure to help me get through mine.\n\nI sit here now in a wee house that is mine;\nCupboards stacked, heating on and more happiness I couldn’t find.\n\nI can’t help but smile now as I look back to when I nearly lost my mind;\nTo know how lucky I was in my darkest day, to be saved by people of the best kind.",
             audio: "audio/track_14.mp3" }
        ];

        // ==========================================
        // 2. SCENE SETUP & PLAYER RIG
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111); 
        
        const playerRig = new THREE.Group();
        playerRig.position.set(0, 1.2, 0); 
        scene.add(playerRig);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0); 
        camera.rotation.order = 'YXZ'; 
        playerRig.add(camera); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);
        
        const pointLight = new THREE.PointLight(0xffffee, 1.5, 50);
        pointLight.position.set(0, 10, 0);
        scene.add(pointLight);

        // ==========================================
        // 3. ENVIRONMENT & ROOM (Textures)
        // ==========================================
        const roomSize = 40;
        const textureLoader = new THREE.TextureLoader();
        
        const wallTexture = textureLoader.load('images/wall.jpg');
        wallTexture.wrapS = THREE.RepeatWrapping;
        wallTexture.wrapT = THREE.RepeatWrapping;
        wallTexture.repeat.set(8, 2); 

        const floorTexture = textureLoader.load('images/floor.jpg');
        floorTexture.wrapS = THREE.RepeatWrapping;
        floorTexture.wrapT = THREE.RepeatWrapping;
        floorTexture.repeat.set(10, 10); 

        const roomGeometry = new THREE.BoxGeometry(roomSize, 12, roomSize);
        
        const wallMaterial = new THREE.MeshStandardMaterial({ 
            map: wallTexture, color: 0xffffff, side: THREE.BackSide 
        });
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            map: floorTexture, color: 0xcccccc, side: THREE.BackSide 
        });
        const ceilingMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x222222, side: THREE.BackSide 
        });
        
        const roomMaterials = [wallMaterial, wallMaterial, ceilingMaterial, floorMaterial, wallMaterial, wallMaterial];
        const room = new THREE.Mesh(roomGeometry, roomMaterials);
        room.position.y = 6; 
        scene.add(room);

        // ==========================================
        // 4. EASEL GENERATOR
        // ==========================================
       function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 1024, 1024);
            ctx.fillStyle = '#000000';
            
            // Reduced font size to 20px to fit longer essays
            ctx.font = 'bold 22px sans-serif'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            
            // Widened the text area to fit more words per line
            const maxWidth = 960; 
            const lineHeight = 30; // Tighter line height
            let y = 30; // Start slightly higher up on the canvas

            const paragraphs = text.split('\n');
            paragraphs.forEach(paragraph => {
                // If it's an intentional blank line (\n\n), add a slightly smaller gap
                if (paragraph === "") {
                    y += lineHeight * 0.8; 
                    return;
                }

                const words = paragraph.split(' ');
                let currentLine = '';

                for (let n = 0; n < words.length; n++) {
                    const testLine = currentLine + words[n] + ' ';
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && n > 0) {
                        ctx.fillText(currentLine, 512, y); // Center is 512
                        currentLine = words[n] + ' ';
                        y += lineHeight;
                    } else {
                        currentLine = testLine;
                    }
                }
                ctx.fillText(currentLine, 512, y);
                y += lineHeight; 
            });
            return new THREE.CanvasTexture(canvas);
        }

        const easels = new THREE.Group();
        scene.add(easels);

        // Updated for 14 easels: 4 on Front/Back walls, 3 on Left/Right walls
        const positions = [
            // Back Wall (4 easels)
            { x: -12, z: -18, rotY: 0 }, { x: -4, z: -18, rotY: 0 }, { x: 4, z: -18, rotY: 0 }, { x: 12, z: -18, rotY: 0 },
            // Front Wall (4 easels)
            { x: 12, z: 18, rotY: Math.PI }, { x: 4, z: 18, rotY: Math.PI }, { x: -4, z: 18, rotY: Math.PI }, { x: -12, z: 18, rotY: Math.PI },
            // Right Wall (3 easels)
            { x: 18, z: -10, rotY: -Math.PI/2 }, { x: 18, z: 0, rotY: -Math.PI/2 }, { x: 18, z: 10, rotY: -Math.PI/2 },
            // Left Wall (3 easels)
            { x: -18, z: 10, rotY: Math.PI/2 }, { x: -18, z: 0, rotY: Math.PI/2 }, { x: -18, z: -10, rotY: Math.PI/2 }
        ];

        galleryItems.forEach((data, i) => {
            const pos = positions[i];
            const easelGroup = new THREE.Group();
            
            const imgGeo = new THREE.PlaneGeometry(3, 3);
            const imgMat = new THREE.MeshBasicMaterial({ map: textureLoader.load(data.image), side: THREE.DoubleSide });
            const imgMesh = new THREE.Mesh(imgGeo, imgMat);
            imgMesh.position.set(-2, 2.5, 0);
            
            const borderMat = new THREE.MeshStandardMaterial({ color: 0x2a1610 });
            const borderMesh = new THREE.Mesh(new THREE.BoxGeometry(3.2, 3.2, 0.1), borderMat);
            borderMesh.position.set(-2, 2.5, -0.06);

            const textMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2.5), new THREE.MeshBasicMaterial({ map: createTextTexture(data.text) }));
            textMesh.position.set(1.5, 2.75, 0);
            
            const textBorder = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.7, 0.1), borderMat);
            textBorder.position.set(1.5, 2.75, -0.06);

            const btnMesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 0.2), new THREE.MeshStandardMaterial({ color: 0x28a745 }));
            btnMesh.position.set(1.5, 1, 0);
            btnMesh.userData = { isAudioButton: true, audioUrl: data.audio };

            easelGroup.add(imgMesh, borderMesh, textMesh, textBorder, btnMesh);
            easelGroup.position.set(pos.x, 0, pos.z);
            easelGroup.rotation.y = pos.rotY;
            easels.add(easelGroup);
        });

        // ==========================================
        // 5. AUDIO PLAYBACK FUNCTION 
        // ==========================================
        
        // --- BACKGROUND MUSIC ---
        const bgMusic = new Audio("audio/background.mp3");
        bgMusic.loop = true;
        bgMusic.volume = 0.15; // 15% volume

        let bgMusicStarted = false;
        function startBgMusic() {
            if (!bgMusicStarted) {
                let playPromise = bgMusic.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        // Success! The browser allowed the audio to play.
                        bgMusicStarted = true;
                        
                        // Now we can safely remove the listeners
                        window.removeEventListener('click', startBgMusic);
                        window.removeEventListener('touchstart', startBgMusic);
                        window.removeEventListener('touchend', startBgMusic);
                    }).catch(error => {
                        // Browser blocked it (likely a touchstart). 
                        // Do nothing, let it try again on the next tap or touchend.
                        console.log("Awaiting valid user tap to start music.");
                    });
                }
            }
        }
        
        // Listen for all types of interaction to catch the one the mobile browser accepts
        window.addEventListener('click', startBgMusic);
        window.addEventListener('touchstart', startBgMusic);
        window.addEventListener('touchend', startBgMusic);


        // --- EXHIBIT AUDIO ---
        let currentAudio = null;
        function playAudio(buttonObject) {
            const url = buttonObject.userData.audioUrl;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            const originalColor = buttonObject.material.color.getHex();
            buttonObject.material.color.setHex(0xffffff);
            setTimeout(() => buttonObject.material.color.setHex(originalColor), 200);

            currentAudio = new Audio(url);
            currentAudio.play().catch(e => console.log("Audio playback error.", e));
        }

        // ==========================================
        // 6. VR CONTROLLER SETUP & LOGIC
        // ==========================================
        const raycaster = new THREE.Raycaster();
        
        function onSelectStart(event) {
            const controller = event.target;
            const tempMatrix = new THREE.Matrix4();
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

            const intersects = raycaster.intersectObjects(easels.children, true);
            const clickedButton = intersects.find(i => i.object.userData.isAudioButton);
            if (clickedButton) playAudio(clickedButton.object);
        }

        function createPointerLine() {
            const geometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0), 
                new THREE.Vector3(0, 0, -10) 
            ]);
            return new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0xffffff }));
        }

        const controller1 = renderer.xr.getController(0);
        controller1.addEventListener('selectstart', onSelectStart);
        controller1.add(createPointerLine());
        playerRig.add(controller1); 

        const controller2 = renderer.xr.getController(1);
        controller2.addEventListener('selectstart', onSelectStart);
        controller2.add(createPointerLine());
        playerRig.add(controller2); 

        let isExitingVR = false;

        function handleVRJoystick() {
            if (!renderer.xr.isPresenting) return;
            const session = renderer.xr.getSession();
            if (!session) return;
            
            const vrMoveSpeed = 0.08;
            const vrTurnSpeed = 0.04;

            session.inputSources.forEach((source) => {
                if (source.gamepad) {
                    const axes = source.gamepad.axes;
                    const xAxis = axes.length > 2 ? axes[2] : axes[0];
                    const yAxis = axes.length > 3 ? axes[3] : axes[1];

                    if (Math.abs(xAxis) > 0.1 || Math.abs(yAxis) > 0.1) {
                        if (source.handedness === 'left') {
                            const moveDir = new THREE.Vector3();
                            camera.getWorldDirection(moveDir);
                            moveDir.y = 0; 
                            moveDir.normalize();

                            const strafeDir = new THREE.Vector3();
                            strafeDir.crossVectors(camera.up, moveDir).normalize();
                            
                            playerRig.position.addScaledVector(moveDir, -yAxis * vrMoveSpeed);
                            playerRig.position.addScaledVector(strafeDir, -xAxis * vrMoveSpeed);
                        }
                        
                        if (source.handedness === 'right') {
                            playerRig.rotation.y -= xAxis * vrTurnSpeed;
                        }
                    }

                    if (source.handedness === 'left' && !isExitingVR) {
                        let exitPressed = false;
                        for (let b = 4; b < source.gamepad.buttons.length; b++) {
                            if (source.gamepad.buttons[b].pressed) {
                                exitPressed = true;
                                break;
                            }
                        }

                        if (exitPressed) {
                            isExitingVR = true;
                            session.end().then(() => {
                                isExitingVR = false;
                            }).catch(() => {
                                isExitingVR = false;
                            });
                        }
                    }
                }
            });
        }

        // ==========================================
        // 7. DESKTOP/MOBILE LOOK INTERACTION
        // ==========================================
        const mouse = new THREE.Vector2();
        let isDragging = false;
        let previousPosition = { x: 0, y: 0 };
        let dragDistance = 0; 

        function handleDragStart(x, y) {
            if (renderer.xr.isPresenting) return; 
            isDragging = true;
            dragDistance = 0;
            previousPosition = { x, y };
        }

        function handleDragMove(x, y) {
            if (!isDragging || renderer.xr.isPresenting) return;
            const deltaX = x - previousPosition.x;
            const deltaY = y - previousPosition.y;
            dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

            const lookSpeed = 0.005;
            camera.rotation.y -= deltaX * lookSpeed;
            camera.rotation.x -= deltaY * lookSpeed;
            camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
            previousPosition = { x, y };
        }

        function handleDragEnd() { isDragging = false; }

        window.addEventListener('mousedown', (e) => handleDragStart(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => handleDragMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', handleDragEnd);

        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#mobile-controls') || renderer.xr.isPresenting) return;
            if (e.touches.length > 0) handleDragStart(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('touchmove', (e) => {
            if (e.target.closest('#mobile-controls') || renderer.xr.isPresenting) return;
            if (e.touches.length > 0) handleDragMove(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('touchend', handleDragEnd);

        window.addEventListener('click', (event) => {
            if (dragDistance > 10 || renderer.xr.isPresenting) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(easels.children, true);
            const clickedButton = intersects.find(i => i.object.userData.isAudioButton);
            if (clickedButton) playAudio(clickedButton.object);
        });

        // ==========================================
        // 8. DESKTOP MOVEMENT CONTROLS 
        // ==========================================
        const keys = { w: false, a: false, s: false, d: false };
        const moveSpeed = 0.15;
        const turnSpeed = 0.03;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') keys.w = true;
            if (e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 'ArrowRight') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') keys.w = false;
            if (e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 'ArrowRight') keys.d = false;
        });

        function bindVirtualButton(id, keyBinding) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyBinding] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyBinding] = false; });
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); keys[keyBinding] = true; });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); keys[keyBinding] = false; });
            btn.addEventListener('mouseleave', (e) => { e.preventDefault(); keys[keyBinding] = false; });
        }

        bindVirtualButton('btn-up', 'w');
        bindVirtualButton('btn-down', 's');
        bindVirtualButton('btn-left', 'a');
        bindVirtualButton('btn-right', 'd');

        // ==========================================
        // 9. RENDER LOOP 
        // ==========================================
        function animate() {
            if (renderer.xr.isPresenting) {
                handleVRJoystick();
            } else {
                const moveDirection = new THREE.Vector3();
                camera.getWorldDirection(moveDirection);
                moveDirection.y = 0; 
                moveDirection.normalize();

                if (keys.w) playerRig.position.addScaledVector(moveDirection, moveSpeed);
                if (keys.s) playerRig.position.addScaledVector(moveDirection, -moveSpeed);
                if (keys.a) playerRig.rotation.y += turnSpeed;
                if (keys.d) playerRig.rotation.y -= turnSpeed;
            }

            if (playerRig.position.x > 18) playerRig.position.x = 18;
            if (playerRig.position.x < -18) playerRig.position.x = -18;
            if (playerRig.position.z > 18) playerRig.position.z = 18;
            if (playerRig.position.z < -18) playerRig.position.z = -18;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        renderer.setAnimationLoop(animate);
    </script>
</body>
