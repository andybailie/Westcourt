<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Audio-Visual Gallery (VR Ready)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            user-select: none; 
            touch-action: none;
            overscroll-behavior: none;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            line-height: 1.5;
            font-size: 14px;
            z-index: 10;
        }
        
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        .control-row {
            display: flex;
            gap: 20px;
        }
        .dir-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
        }
        .dir-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }

        @media (min-width: 800px) {
            #mobile-controls {
                opacity: 0.5; 
            }
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <strong>Controls:</strong><br>
        🖱️/👆 <strong>Look:</strong> Drag screen<br>
        🖱️/👆 <strong>Play:</strong> Tap green buttons<br>
        ⌨️/🔘 <strong>Move:</strong> Arrow keys or on-screen buttons<br>
        🥽 <strong>VR:</strong> Click "ENTER VR" at the bottom
    </div>

    <!-- On-Screen D-Pad -->
    <div id="mobile-controls">
        <div class="dir-btn" id="btn-up">⬆️</div>
        <div class="control-row">
            <div class="dir-btn" id="btn-left">⬅️</div>
            <div class="dir-btn" id="btn-down">⬇️</div>
            <div class="dir-btn" id="btn-right">➡️</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        // 1. Import the VR Button
        import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';

        // ==========================================
        // 1. GALLERY DATA CONFIGURATION
        // ==========================================
        const galleryItems = [
            {
                image: "images/image_1.jpg",
                text: "Exhibit 1\n\nCommercial Narration.\n\nA warm, authoritative read tailored for corporate broadcasting and brand anthems.",
                audio: "audio/track_1.mp3"
            },
            {
                image: "images/image_2.jpg",
                text: "Exhibit 2\n\nCharacter Voice.\n\nDeep and gravelly tone suitable for video game antagonists or dramatic storytelling.",
                audio: "audio/track_2.mp3"
            },
            {
                image: "images/image_3.jpg",
                text: "Exhibit 3\n\nE-Learning Module.\n\nClear, paced, and articulate delivery to guide listeners through complex technical concepts.",
                audio: "audio/track_3.mp3"
            },
            {
                image: "images/image_4.jpg",
                text: "Exhibit 4\n\nDocumentary Read.\n\nNatural, resonant Northern Irish delivery for long-form factual content and nature programming.",
                audio: "audio/track_4.mp3"
            },
            {
                image: "images/image_5.jpg",
                text: "Exhibit 5\n\nAudiobook Sample - Fiction.\n\nDynamic pacing showcasing emotional range and subtle character distinctions.",
                audio: "audio/track_5.mp3"
            },
            {
                image: "images/image_6.jpg",
                text: "Exhibit 6\n\nRadio Imaging.\n\nPunchy, high-energy sweepers and station idents to cut through the mix.",
                audio: "audio/track_6.mp3"
            },
            {
                image: "images/image_7.jpg",
                text: "Exhibit 7\n\nAnimation Voiceover.\n\nExaggerated and expressive vocal performance designed for animated shorts.",
                audio: "audio/track_7.mp3"
            },
            {
                image: "images/image_8.jpg",
                text: "Exhibit 8\n\nPodcast Intro.\n\nInviting and professional establishing tone to hook listeners in the first ten seconds.",
                audio: "audio/track_8.mp3"
            },
            {
                image: "images/image_9.jpg",
                text: "Exhibit 9\n\nMedical Narration.\n\nPrecise pronunciation and measured delivery for clinical or pharmaceutical scripts.",
                audio: "audio/track_9.mp3"
            },
            {
                image: "images/image_10.jpg",
                text: "Exhibit 10\n\nPromo Read.\n\nUrgent, intense style perfect for upcoming event trailers and television promos.",
                audio: "audio/track_10.mp3"
            },
            {
                image: "images/image_11.jpg",
                text: "Exhibit 11\n\nExplainer Video.\n\nFriendly, conversational approach that makes dry information accessible and engaging.",
                audio: "audio/track_11.mp3"
            },
            {
                image: "images/image_12.jpg",
                text: "Exhibit 12\n\nTheatrical Trailer.\n\nMaximum resonance and gravitas for cinematic theatrical releases.",
                audio: "audio/track_12.mp3"
            }
        ];

        // ==========================================
        // 2. SCENE SETUP
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333); 
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0); 
        camera.rotation.order = 'YXZ'; 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        // 2. Enable WebXR on the renderer
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // 3. Add the VR Button to the web page
        document.body.appendChild(VRButton.createButton(renderer));

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);
        
        const pointLight = new THREE.PointLight(0xffffee, 1.5, 50);
        pointLight.position.set(0, 10, 0);
        scene.add(pointLight);

        // ==========================================
        // 3. ENVIRONMENT & ROOM
        // ==========================================
        const roomSize = 40;
        const textureLoader = new THREE.TextureLoader();
        
        const roomGeometry = new THREE.BoxGeometry(roomSize, 12, roomSize);
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x888888, side: THREE.BackSide });
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x555555, side: THREE.BackSide });
        const ceilingMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, side: THREE.BackSide });
        
        const roomMaterials = [wallMaterial, wallMaterial, ceilingMaterial, floorMaterial, wallMaterial, wallMaterial];
        const room = new THREE.Mesh(roomGeometry, roomMaterials);
        room.position.y = 6; 
        scene.add(room);

        // ==========================================
        // 4. EASEL GENERATOR
        // ==========================================
        function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 28px sans-serif'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            
            const maxWidth = 460; 
            const lineHeight = 36;
            let y = 40; 

            const paragraphs = text.split('\n');
            paragraphs.forEach(paragraph => {
                const words = paragraph.split(' ');
                let currentLine = '';

                for (let n = 0; n < words.length; n++) {
                    const testLine = currentLine + words[n] + ' ';
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && n > 0) {
                        ctx.fillText(currentLine, 256, y);
                        currentLine = words[n] + ' ';
                        y += lineHeight;
                    } else {
                        currentLine = testLine;
                    }
                }
                ctx.fillText(currentLine, 256, y);
                y += lineHeight; 
            });
            return new THREE.CanvasTexture(canvas);
        }

        const easels = new THREE.Group();
        scene.add(easels);

        const positions = [
            { x: -10, z: -18, rotY: 0 }, { x: 0, z: -18, rotY: 0 }, { x: 10, z: -18, rotY: 0 },
            { x: 10, z: 18, rotY: Math.PI }, { x: 0, z: 18, rotY: Math.PI }, { x: -10, z: 18, rotY: Math.PI },
            { x: 18, z: -10, rotY: -Math.PI/2 }, { x: 18, z: 0, rotY: -Math.PI/2 }, { x: 18, z: 10, rotY: -Math.PI/2 },
            { x: -18, z: 10, rotY: Math.PI/2 }, { x: -18, z: 0, rotY: Math.PI/2 }, { x: -18, z: -10, rotY: Math.PI/2 }
        ];

        galleryItems.forEach((data, i) => {
            const pos = positions[i];
            const easelGroup = new THREE.Group();
            
            const imgGeo = new THREE.PlaneGeometry(3, 3);
            const imgMat = new THREE.MeshBasicMaterial({ map: textureLoader.load(data.image), side: THREE.DoubleSide });
            const imgMesh = new THREE.Mesh(imgGeo, imgMat);
            imgMesh.position.set(-2, 2.5, 0);
            
            const borderMat = new THREE.MeshStandardMaterial({ color: 0x2a1610 });
            const borderMesh = new THREE.Mesh(new THREE.BoxGeometry(3.2, 3.2, 0.1), borderMat);
            borderMesh.position.set(-2, 2.5, -0.06);

            const textMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2.5), new THREE.MeshBasicMaterial({ map: createTextTexture(data.text) }));
            textMesh.position.set(1.5, 2.75, 0);
            
            const textBorder = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.7, 0.1), borderMat);
            textBorder.position.set(1.5, 2.75, -0.06);

            const btnMesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 0.2), new THREE.MeshStandardMaterial({ color: 0x28a745 }));
            btnMesh.position.set(1.5, 1, 0);
            btnMesh.userData = { isAudioButton: true, audioUrl: data.audio };

            easelGroup.add(imgMesh, borderMesh, textMesh, textBorder, btnMesh);
            easelGroup.position.set(pos.x, 0, pos.z);
            easelGroup.rotation.y = pos.rotY;
            easels.add(easelGroup);
        });

        // ==========================================
        // 5. AUDIO PLAYBACK FUNCTION (Shared)
        // ==========================================
        let currentAudio = null;
        function playAudio(buttonObject) {
            const url = buttonObject.userData.audioUrl;
            
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            
            const originalColor = buttonObject.material.color.getHex();
            buttonObject.material.color.setHex(0xffffff);
            setTimeout(() => buttonObject.material.color.setHex(originalColor), 200);

            currentAudio = new Audio(url);
            currentAudio.play().catch(e => console.log("Audio playback requires user interaction.", e));
        }


        // ==========================================
        // 6. VR CONTROLLER SETUP
        // ==========================================
        function onSelectStart(event) {
            const controller = event.target;
            
            // Calculate where the controller is pointing
            const tempMatrix = new THREE.Matrix4();
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

            const intersects = raycaster.intersectObjects(easels.children, true);
            const clickedButton = intersects.find(i => i.object.userData.isAudioButton);

            if (clickedButton) {
                playAudio(clickedButton.object);
            }
        }

        // Create a visual laser pointer for the controllers
        function createPointerLine() {
            const geometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0), 
                new THREE.Vector3(0, 0, -10) // 10 meter long beam
            ]);
            const material = new THREE.LineBasicMaterial({ color: 0xffffff });
            return new THREE.Line(geometry, material);
        }

        const controller1 = renderer.xr.getController(0);
        controller1.addEventListener('selectstart', onSelectStart);
        controller1.add(createPointerLine());
        scene.add(controller1);

        const controller2 = renderer.xr.getController(1);
        controller2.addEventListener('selectstart', onSelectStart);
        controller2.add(createPointerLine());
        scene.add(controller2);


        // ==========================================
        // 7. DESKTOP/MOBILE LOOK INTERACTION
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        let isDragging = false;
        let previousPosition = { x: 0, y: 0 };
        let dragDistance = 0; 

        function handleDragStart(x, y) {
            if (renderer.xr.isPresenting) return; // Disable drag look in VR
            isDragging = true;
            dragDistance = 0;
            previousPosition = { x, y };
        }

        function handleDragMove(x, y) {
            if (!isDragging || renderer.xr.isPresenting) return;
            const deltaX = x - previousPosition.x;
            const deltaY = y - previousPosition.y;
            
            dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

            const lookSpeed = 0.005;
            camera.rotation.y -= deltaX * lookSpeed;
            camera.rotation.x -= deltaY * lookSpeed;
            camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));

            previousPosition = { x, y };
        }

        function handleDragEnd() {
            isDragging = false;
        }

        window.addEventListener('mousedown', (e) => handleDragStart(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => handleDragMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', handleDragEnd);

        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#mobile-controls') || renderer.xr.isPresenting) return;
            if (e.touches.length > 0) {
                handleDragStart(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
        window.addEventListener('touchmove', (e) => {
            if (e.target.closest('#mobile-controls') || renderer.xr.isPresenting) return;
            if (e.touches.length > 0) {
                handleDragMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
        window.addEventListener('touchend', handleDragEnd);

        window.addEventListener('click', (event) => {
            if (dragDistance > 10 || renderer.xr.isPresenting) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(easels.children, true);
            const clickedButton = intersects.find(i => i.object.userData.isAudioButton);

            if (clickedButton) {
                playAudio(clickedButton.object);
            }
        });

        window.addEventListener('mousemove', (event) => {
            if(isDragging || renderer.xr.isPresenting) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(easels.children, true);
            const hovering = intersects.some(i => i.object.userData.isAudioButton);
            document.body.style.cursor = hovering ? 'pointer' : 'default';
        });

        // ==========================================
        // 8. MOVEMENT CONTROLS (Keyboard & On-Screen)
        // ==========================================
        const keys = { w: false, a: false, s: false, d: false };
        const moveSpeed = 0.15;
        const turnSpeed = 0.03;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') keys.w = true;
            if (e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 'ArrowRight') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') keys.w = false;
            if (e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 'ArrowRight') keys.d = false;
        });

        function bindVirtualButton(id, keyBinding) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyBinding] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyBinding] = false; });
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); keys[keyBinding] = true; });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); keys[keyBinding] = false; });
            btn.addEventListener('mouseleave', (e) => { e.preventDefault(); keys[keyBinding] = false; });
        }

        bindVirtualButton('btn-up', 'w');
        bindVirtualButton('btn-down', 's');
        bindVirtualButton('btn-left', 'a');
        bindVirtualButton('btn-right', 'd');

        // ==========================================
        // 9. RENDER LOOP (Updated for WebXR)
        // ==========================================
        function animate() {
            // Only process desktop/mobile manual movement if we are NOT inside VR.
            // Inside VR, the headset's physical location controls the camera.
            if (!renderer.xr.isPresenting) {
                const moveDirection = new THREE.Vector3();
                camera.getWorldDirection(moveDirection);
                moveDirection.y = 0; 
                moveDirection.normalize();

                if (keys.w) camera.position.addScaledVector(moveDirection, moveSpeed);
                if (keys.s) camera.position.addScaledVector(moveDirection, -moveSpeed);
                
                if (keys.a) camera.rotation.y += turnSpeed;
                if (keys.d) camera.rotation.y -= turnSpeed;

                if (camera.position.x > 18) camera.position.x = 18;
                if (camera.position.x < -18) camera.position.x = -18;
                if (camera.position.z > 18) camera.position.z = 18;
                if (camera.position.z < -18) camera.position.z = -18;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 4. Use setAnimationLoop instead of requestAnimationFrame for VR
        renderer.setAnimationLoop(animate);
    </script>
</body>
</html>
